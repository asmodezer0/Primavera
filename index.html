:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:#07050e radial-gradient(circle at 50% 42%,#301537,#100a1b 42%,#05040a 76%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sky{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#f4a9ff 1px,transparent 1.2px);background-size:59px 59px;opacity:.38;mask-image:radial-gradient(ellipse at center,#000,transparent 76%)}.wrap{width:min(92vw,720px);position:relative;text-align:center;contain:paint}svg{width:100%;height:auto;overflow:visible}.draw{fill:var(--ink);stroke:var(--ink);stroke-width:.45px;paint-order:stroke;filter:url(#neon);visibility:hidden}.draw.active{visibility:visible}.core .draw{font-size:14px}.stem .draw{font-size:17px}.caption,.note{opacity:0;transition:opacity .55s ease}.caption.visible,.note.visible{opacity:1}.caption{margin:-2.45rem 0 0;color:#fff4bd;font-size:clamp(.72rem,2.2vw,.92rem);letter-spacing:.28em;text-transform:uppercase;text-shadow:0 0 12px #ffc14d}.note{color:#bba8d3;font-size:.7rem;letter-spacing:.1em}@media(max-width:420px){text{font-size:13px!important}.stem .draw{font-size:14px!important}}@media(prefers-reduced-motion:reduce){.caption,.note{transition:none}}
</style></head><body><div class="sky"></div><main class="wrap"><svg viewBox="0 0 720 760" role="img" aria-label="Girasol neón que se escribe letra por letra con el texto I wolf you"><defs><filter id="neon" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="2.2" result="b"/><feFlood flood-color="#ffbd3f" result="c"/><feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter><path id="p" d="M360 292C318 245 323 174 360 108C397 174 402 245 360 292"/><path id="c1" d="M360 202A105 105 0 1 1 359.9 202"/><path id="c2" d="M360 224A83 83 0 1 1 359.9 224"/><path id="s" d="M360 392C342 493 383 553 358 688"/><path id="l" d="M355 535C302 482 233 488 185 545C250 564 309 574 355 535"/><path id="r" d="M370 580C423 522 490 535 535 592C472 610 414 619 370 580"/></defs><g id="petals"></g><g class="core" id="core" style="--ink:#ff76d4"></g><g class="stem" id="stem" style="--ink:#89ffe0"></g><g class="leaf" id="leaves" style="--ink:#79fbd7"></g></svg><p class="caption">I wolf you</p><p class="note">un girasol que brilla incluso de noche</p></main><script>
const ns='http://www.w3.org/2000/svg',phrase='I wolf you · I wolf you · I wolf you · I wolf you · I wolf you ·',stages=[];
function line(parent,href,ink,transform,content,size){const text=document.createElementNS(ns,'text'),path=document.createElementNS(ns,'textPath');text.classList.add('draw');text.style.setProperty('--ink',ink);if(transform)text.setAttribute('transform',transform);if(size)text.style.fontSize=size;path.setAttribute('href',href);path.setAttribute('startOffset','1%');text.append(path);parent.append(text);stages.push({text,path,content,speed:18});}
const petals=document.querySelector('#petals');for(let i=0;i<12;i++)line(petals,'#p','#ffcc52',`rotate(${i*30} 360 292)`,phrase);
line(document.querySelector('#core'),'#c1','#ff76d4','',phrase,'14px');line(document.querySelector('#core'),'#c2','#ff76d4','',phrase,'14px');line(document.querySelector('#stem'),'#s','#89ffe0','',phrase,'17px');line(document.querySelector('#leaves'),'#l','#79fbd7','',phrase);line(document.querySelector('#leaves'),'#r','#79fbd7','',phrase);
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function type(stage){return new Promise(resolve=>{stage.text.classList.add('active');let start,last=-1;function frame(now){start??=now;const count=Math.min(stage.content.length,Math.floor((now-start)/stage.speed)+1);if(count!==last){stage.path.textContent=stage.content.slice(0,count);last=count}count<stage.content.length?requestAnimationFrame(frame):resolve()}requestAnimationFrame(frame)})}
async function draw(){if(matchMedia('(prefers-reduced-motion:reduce)').matches){stages.forEach(s=>{s.text.classList.add('active');s.path.textContent=s.content})}else{for(const stage of stages){await type(stage);await wait(75)}}document.querySelectorAll('.caption,.note').forEach(el=>el.classList.add('visible'))}draw();
</script></body></html>
